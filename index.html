    <script>
        // دالة تنسيق التاريخ بشكل ثابت بالعربية
        function formatDate(dateStr) {
            if (!dateStr) return "";
            const parts = dateStr.split( - ); // yyyy-mm-dd
            const year = parseInt(parts, 10);
            const month = parseInt(parts, 10);
            const day = parseInt(parts, 10);

            const arabicDays = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
            const arabicMonths = [
                "يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو",
                "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"
            ];

            // إنشاء كائن تاريخ بالتوقيت المحلي لتحديد اليوم
            const d = new Date(year, month - 1, day);
            const dayName = arabicDays[d.getDay()];
            const monthName = arabicMonths[month - 1];

            return `${dayName}، ${day} ${monthName} ${year}`;
        }

        function sendToWhatsapp(e) {
            e.preventDefault();

            const name = document.getElementById("patientName").value.trim();
            const phone = document.getElementById("patientPhone").value.trim();
            const service = document.getElementById("requestedService").value;
            const date = document.getElementById("bookingDate").value;

            if (!name || !phone || !date) {
                alert("يرجى تعبئة جميع الحقول أولاً.");
                return;
            }

            const formattedDate = formatDate(date);
            
            // نص الرسالة قبل التشفير
            const rawMessage = `🦷 *طلب حجز موعد جديد* 🦷\n\n` +
                             `👤 *اسم المريض:* ${name}\n` +
                             `📱 *رقم التواصل:* ${phone}\n` +
                             `🩺 *الخدمة المطلوبة:* ${service}\n` +
                             `📅 *التاريخ المفضل:* ${formattedDate}\n\n` +
                             `📥 _أرجو تأكيد الموعد وتحديد الساعة المناسبة._`;

            // تشفير النص بشكل صحيح
            const encodedText = encodeURIComponent(rawMessage);
            
            // رقم الدكتور
            const doctorPhone = "967770423656"; 
            const whatsappUrl = `https://wa.me/${doctorPhone}?text=${encodedText}`;

            // محاولة 1: فتح في نافذة جديدة (الأكثر نجاحاً)
            const newWindow = window.open(whatsappUrl,  _blank );

            // محاولة 2: إذا تم حظر النافذة المنبثقة، نحاول التحويل في نفس الصفحة
            if (!newWindow || newWindow.closed || typeof newWindow.closed ==  undefined ) {
                // تم حظر النافذة، نحاول التوجيه مباشرة
                window.location.href = whatsappUrl;
            }
        }
    </script>
